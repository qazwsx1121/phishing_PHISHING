{% extends "base.html" %}
{% block content %}
<h1>의심스러운 링크를 검사해 보세요</h1>
<p class="lead">문자나 메신저로 받은 주소를 붙여넣으면 피싱 가능성을 알려 드립니다. 링크는 직접 열지 말고 주소만 복사해 주세요.</p>

{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="/analyze" class="check-form">
  <label for="url">검사할 URL</label>
  <div class="check-row">
    <input id="url" type="text" name="url" value="{{ url_value }}" placeholder="검사할 주소를 붙여넣으세요"
           inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <button type="submit">검사하기</button>
  </div>
</form>
{% endblock %}
